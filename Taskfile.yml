version: '3'

vars:
  LOCAL_VERIFY:
    sh: >-
      if [ "${GITHUB_ACTIONS:-}" != true ] &&
      { command -v opensoha-verify >/dev/null 2>&1 || [ -n "${OPENSOHA_LOCAL_VERIFY_REQUIRED:-}" ]; };
      then echo "opensoha-verify run --"; fi
  LOCAL_DOCKER_BUILD:
    sh: >-
      if [ "${GITHUB_ACTIONS:-}" != true ] &&
      { command -v opensoha-verify >/dev/null 2>&1 || [ -n "${OPENSOHA_LOCAL_VERIFY_REQUIRED:-}" ]; };
      then echo "opensoha-verify build-image --"; else echo "docker build"; fi
  APP_NAME: "soha-app"
  BIN_DIR: "bin"
  PACKAGE_MANAGER: '{{.PACKAGE_MANAGER | default "npm"}}'
  RELEASE_LDFLAGS: '{{.RELEASE_LDFLAGS | default ""}}'
  SERVICE_LDFLAGS: '{{.SERVICE_LDFLAGS | default ""}}'
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  # Target OS for build/package/run. Defaults to the host OS. Cross-builds must
  # use the task runner form: `wails3 task build GOOS=... ARCH=...`.
  GOOS: '{{.GOOS | default OS}}'

env:
  GOWORK: "off"

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml
  ios: ./build/ios/Taskfile.yml
  android: ./build/android/Taskfile.yml

tasks:
  test:
    cmds:
      - "{{.LOCAL_VERIFY}} go test ./..."
  vet:
    cmds:
      - "{{.LOCAL_VERIFY}} go vet ./..."
  verify:docker:
    deps:
      - task: common:build:frontend
        vars:
          BUILD_FLAGS: "-tags server,production"
    cmds:
      - "opensoha-verify image -- -f build/docker/Dockerfile.server ."
  build:
    summary: Builds the application
    cmds:
      - task: "{{.GOOS}}:build"
        vars:
          RELEASE_LDFLAGS: '{{.RELEASE_LDFLAGS}}'
          SERVICE_LDFLAGS: '{{.SERVICE_LDFLAGS}}'

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{.GOOS}}:package"

  run:
    summary: Runs the application
    cmds:
      - task: "{{.GOOS}}:run"

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  setup:docker:
    summary: Builds Docker image for cross-compilation (~800MB download)
    cmds:
      - task: common:setup:docker

  build:server:
    summary: Builds the application in server mode (no GUI, HTTP server only)
    cmds:
      - task: common:build:server

  run:server:
    summary: Runs the application in server mode
    cmds:
      - task: common:run:server

  build:docker:
    summary: Builds a Docker image for server mode deployment
    cmds:
      - task: common:build:docker

  run:docker:
    summary: Builds and runs the Docker image
    cmds:
      - task: common:run:docker
